[package]
name = "markymark-cli"
description = "High-performance Markdown LSP and MCP server for AI assistants and code editors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["markdown", "lsp", "mcp", "language-server", "ai"]
categories = ["development-tools", "text-editors"]

[[bin]]
name = "markymark"
path = "src/main.rs"

[dependencies]
markymark-core = { version = "=0.1.0-alpha.2", path = "../markymark-core" }
markymark-lsp = { version = "=0.1.0-alpha.2", path = "../markymark-lsp" }
markymark-mcp = { version = "=0.1.0-alpha.2", path = "../markymark-mcp" }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
