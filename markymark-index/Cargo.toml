[package]
name = "markymark-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Document indexing and cross-reference resolution for markdown workspaces"
keywords = ["markdown", "index", "cross-reference", "workspace"]
categories = ["development-tools", "text-processing"]

[features]
bench-internals = []
embeddings = ["dep:tokio"]

[dependencies]
async-trait = { workspace = true }
markymark-core = { workspace = true, features = ["zig-kernels"] }
markymark-kernels = { workspace = true }
markymark-parser = { workspace = true }
petgraph = { workspace = true }
bumpalo = { workspace = true }
hashbrown = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tree-sitter = { workspace = true }
self_cell = { workspace = true }
log = { workspace = true }
lasso = "0.7.3"
tokio = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true }
memory-stats = "1.2"
libc = "0.2"

[[bin]]
name = "bench_roi_report"
required-features = ["bench-internals"]

[[bench]]
name = "memory"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "realm_update"
harness = false

[[bench]]
name = "index_construction"
harness = false
required-features = ["bench-internals"]
