[package]
name = "markymark-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Zig SIMD kernel FFI bindings for markymark"

[build-dependencies]
walkdir = "2"

[dev-dependencies]
criterion = { workspace = true }
md5 = "0.7"
regex = { workspace = true }
markymark-core = { path = "../markymark-core", features = ["zig-kernels"] }
markymark-index = { path = "../markymark-index" }
markymark-parser = { path = "../markymark-parser" }

[[bench]]
name = "brza_kernels"
harness = false
