name: markymark CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        default: 'false'
        type: boolean

jobs:
  bazel-build-and-test:
    name: Bazel Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', 'Cargo.lock', '.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build all targets
        run: bazel build //...

      - name: Run all tests
        run: bazel test //...

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Purge stale Zig build artifacts
        run: rm -rf .zig-cache zig/.zig-cache

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  miri:
    name: Miri (unsafe arena validation)
    runs-on: ubuntu-latest
    needs: bazel-build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      - name: Run Miri on arena safety tests
        env:
          MIRIFLAGS: "-Zmiri-ignore-leaks"
        run: |
          echo "Running Miri on markymark-core arena safety tests..."
          cargo +nightly miri test -p markymark-core --test miri_arena
          echo "Miri validation passed"

  cargo-canary:
    name: Cargo Canary
    runs-on: ubuntu-latest
    needs: bazel-build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('zig/**/*.zig', 'zig/build.zig', 'zig/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Purge stale Zig build artifacts
        run: rm -rf .zig-cache zig/.zig-cache target/debug/build/markymark-kernels-*/out target/release/build/markymark-kernels-*/out

      - name: Run all tests
        run: cargo test --workspace

      - name: Run smoke tests
        run: cargo test -p markymark-cli --test smoke_lsp --test smoke_mcp

      - name: Run E2E tests
        run: |
          cargo test -p markymark-cli --test lsp_methods -- --nocapture
          cargo test -p markymark-cli --test mcp_methods -- --nocapture

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: bazel-build-and-test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_benchmarks == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-bench-${{ hashFiles('MODULE.bazel', 'Cargo.lock', '.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-bazel-bench-

      - name: Build release binary
        run: bazel build --config=release //markymark-cli:markymark

      - name: Create artifact directory
        run: mkdir -p benchmark-artifacts

      - name: Run benchmarks
        env:
          BENCH_ARTIFACT_DIR: benchmark-artifacts
        run: |
          bazel test --config=release //markymark-cli:markymark-cli_test --test_output=all 2>&1 | tee benchmark-artifacts/bazel-bench.txt
          echo "Benchmark tests completed"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-artifacts/
          retention-days: 30
