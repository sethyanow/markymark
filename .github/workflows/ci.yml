name: markymark CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/zig
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Run all tests
        run: cargo test --workspace

      - name: Run smoke tests
        run: cargo test -p markymark-cli --test smoke_lsp --test smoke_mcp

      - name: Run E2E LSP tests
        run: cargo test -p markymark-cli --test lsp_methods -- --nocapture

      - name: Run E2E MCP tests
        run: cargo test -p markymark-cli --test mcp_methods -- --nocapture

  zig-kernels:
    name: Zig Kernels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Check for zig/markymark-kernels changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            zig-kernels:
              - 'zig/**'
              - 'markymark-kernels/**'
              - 'markymark-index/**'

      - name: Install Rust stable
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Zig
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache cargo registry & build
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-zig-kernels-${{ hashFiles('Cargo.lock', 'zig/build.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-kernels-

      - name: Cache Zig build
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: |
            zig/.zig-cache
            zig/zig-out
          key: ${{ runner.os }}-zig-build-${{ hashFiles('zig/build.zig', 'zig/src/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-build-

      - name: Build Zig static library
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        run: cd zig && zig build lib

      - name: Run Zig unit tests
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        run: cd zig && zig build test

      - name: Run Rust tests with zig-kernels feature
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo test --features zig-kernels

      - name: Clippy with zig-kernels feature
        if: steps.changes.outputs.zig-kernels == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo clippy --features zig-kernels -- -D warnings

      - name: Skip (no zig/kernels changes)
        if: steps.changes.outputs.zig-kernels != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No zig/ or markymark-kernels/ changes detected, skipping."

  miri:
    name: Miri (unsafe arena validation)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      - name: Run Miri on arena safety tests
        env:
          # Ignore leaks from intentional mem::forget in ptr::read ownership
          # transfer pattern (tracked by marky-5yt for self_cell migration).
          MIRIFLAGS: "-Zmiri-ignore-leaks"
        run: |
          echo "Running Miri on markymark-core arena safety tests..."
          cargo +nightly miri test -p markymark-core --test miri_arena
          echo "Miri validation passed"

  alignment:
    name: Alignment Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check marksman availability
        id: marksman-check
        run: |
          if command -v marksman &> /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "marksman found: $(which marksman)"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: marksman not found — alignment tests will be skipped gracefully"
          fi

      - name: Run alignment tests
        run: |
          echo "Running alignment tests (marksman available: ${{ steps.marksman-check.outputs.available }})"
          cargo test -p markymark-cli --test alignment -- --nocapture
          echo "Alignment tests completed (tests skip gracefully if marksman unavailable)"

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_benchmarks == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release -p markymark-cli

      - name: Create artifact directory
        run: mkdir -p benchmark-artifacts

      - name: Run benchmarks
        env:
          BENCH_ARTIFACT_DIR: benchmark-artifacts
        run: |
          cargo test -p markymark-cli --test bench_lsp --release -- --nocapture
          echo "Benchmark tests completed"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-artifacts/
          retention-days: 30
