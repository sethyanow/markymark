[workspace]
resolver = "2"
members = [
    "markymark-core",
    "markymark-parser",
    "markymark-index",
    "markymark-lsp",
    "markymark-mcp",
    "markymark-cli",
    "markymark-kernels",
]

[workspace.package]
version = "0.8.0-dev0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0"
repository = "https://github.com/sethyanow/markymark"
authors = ["Seth Yanow <seth.yanow@gmail.com>"]

[workspace.dependencies]
# Internal crates — versions must match [workspace.package] version above.
# See RELEASING.md for the bump checklist.
markymark-core = { path = "markymark-core", version = "0.8.0-dev0" }
markymark-kernels = { path = "markymark-kernels", version = "0.8.0-dev0" }
markymark-parser = { path = "markymark-parser", version = "0.8.0-dev0" }
markymark-index = { path = "markymark-index", version = "0.8.0-dev0" }
markymark-lsp = { path = "markymark-lsp", version = "0.8.0-dev0" }
markymark-mcp = { path = "markymark-mcp", version = "0.8.0-dev0" }

# Core dependencies
async-trait = "0.1"
tokio = { version = "1.52", features = ["full", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
regex = "1.11"

# LSP dependencies
tower-lsp-server = "0.23"
lsp-types = "0.97"

# MCP dependencies
rmcp = { version = "0.15", features = ["server", "transport-io"] }

# Parser dependencies
tree-sitter = "0.26"
tree-sitter-md = { version = "0.5", features = ["parser"] }
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
json5 = "0.4"

# Graph and algorithms
petgraph = "0.8"

# Memory allocation
bumpalo = { version = "3.19.1", features = ["collections", "boxed", "allocator-api2"] }
hashbrown = "0.16.1"
self_cell = "1.2.2"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Embedding (local ONNX inference)
fastembed = { version = "5.13", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }

# Testing
insta = { version = "1.47", features = ["yaml"] }
proptest = "1.5"
tempfile = "3"
wiremock = "0.6"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Logging
log = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
