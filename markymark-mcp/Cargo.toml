[package]
name = "markymark-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MCP server for markdown intelligence in AI assistants"
keywords = ["markdown", "mcp", "ai", "language-server"]
categories = ["development-tools", "text-processing"]

[features]
default = []
semantic-search = ["markymark-index/embeddings"]
local-embeddings = ["markymark-core/local-embeddings"]

[dependencies]
async-trait = { workspace = true }
markymark-core = { workspace = true }
markymark-parser = { workspace = true }
markymark-index = { workspace = true }
markymark-kernels = { workspace = true }
rmcp = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
