name: Security Scans

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo-audit
        run: cargo audit

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo-deny policy checks
        run: cargo deny check

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze and upload SARIF
        uses: github/codeql-action/analyze@v3
        with:
          category: "/security-workflow/codeql"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (built-in rust + local rules if present)
        run: |
          mkdir -p results
          semgrep scan --config p/rust --sarif --output results/semgrep.sarif . || true
          if [ -d .semgrep ]; then
            semgrep scan --config .semgrep --sarif --output results/semgrep-local.sarif . || true
          fi

      - name: Upload Semgrep SARIF (built-in rules)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/semgrep.sarif
          category: "/security-workflow/semgrep"

      - name: Upload Semgrep SARIF (local rules)
        if: always() && hashFiles('.semgrep/**') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/semgrep-local.sarif
          category: "/security-workflow/semgrep-local"
