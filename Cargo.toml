[workspace]
resolver = "2"
members = [
    "markymark-core",
    "markymark-parser",
    "markymark-index",
    "markymark-lsp",
    "markymark-mcp",
    "markymark-cli",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sethyanow/markymark"
authors = ["Seth Yanow <seth@yanow.me>"]

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.42", features = ["full", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
regex = "1.11"

# LSP dependencies
tower-lsp-server = "0.23"
lsp-types = "0.97"

# MCP dependencies
rmcp = { version = "0.13", features = ["server", "transport-io"] }

# Parser dependencies
tree-sitter = "0.26"
tree-sitter-md = "0.5"
tree-sitter-json = "0.24"

# Graph and algorithms
petgraph = "0.7"

# Memory allocation
bumpalo = { version = "3.16", features = ["collections"] }

# Testing
insta = { version = "1.42", features = ["yaml"] }
proptest = "1.5"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
