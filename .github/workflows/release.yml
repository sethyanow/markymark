name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_NAME: markymark

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bazel: true
            bazel_config: "--config=release --config=macos-lto"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bazel: true
            bazel_config: "--config=release"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bazel: false
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bazel: false

    steps:
      - uses: actions/checkout@v4

      # ── Bazel build path ──────────────────────────────────────────────
      - name: Setup Bazelisk
        if: matrix.bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        if: matrix.bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-${{ matrix.target }}-bazel-release-${{ hashFiles('MODULE.bazel', 'Cargo.lock', '.bazelrc') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-bazel-release-

      - name: Install Homebrew LLVM (macOS)
        if: matrix.bazel && runner.os == 'macOS'
        run: |
          brew install llvm
          # Install clang-lto-wrapper alongside Homebrew LLVM tools
          cp tools/clang-lto-wrapper.sh /opt/homebrew/opt/llvm/bin/clang-lto-wrapper
          chmod +x /opt/homebrew/opt/llvm/bin/clang-lto-wrapper

      - name: Bazel release build
        if: matrix.bazel
        run: bazel build ${{ matrix.bazel_config }} //markymark-cli:markymark

      - name: Prepare Bazel binary (Unix)
        if: matrix.bazel && runner.os != 'Windows'
        run: |
          BAZEL_BIN="$(bazel info bazel-bin ${{ matrix.bazel_config }})"
          cp "${BAZEL_BIN}/markymark-cli/${{ env.BINARY_NAME }}" \
             ${{ env.BINARY_NAME }}-${{ matrix.target }}
          chmod +x ${{ env.BINARY_NAME }}-${{ matrix.target }}

      # ── Cargo build path (Windows + Linux cross) ──────────────────────
      - name: Install Rust stable
        if: ${{ !matrix.bazel }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig (Windows)
        if: ${{ !matrix.bazel && runner.os == 'Windows' }}
        env:
          ZIG_VER: '0.15.2'
        run: |
          $zip = "zig-x86_64-windows-$env:ZIG_VER.zip"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VER/$zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath . -Force
          $zigDir = (Get-ChildItem -Directory -Filter "zig-*" | Select-Object -First 1).FullName
          $zigDirUnix = $zigDir -replace '\\', '/'
          echo "$zigDir" >> $env:GITHUB_PATH
          echo "ZIG_DIR=$zigDirUnix" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install Zig (Linux cross)
        if: ${{ !matrix.bazel && matrix.cross }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cargo release build
        if: ${{ !matrix.bazel }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ -z "${ZIG_DIR:-}" ]; then
              echo "::error::ZIG_DIR not set"
              exit 1
            fi
            export PATH="$ZIG_DIR:$PATH"
          fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p markymark-cli --features semantic-search,local-embeddings
          else
            cargo build --release --target ${{ matrix.target }} -p markymark-cli --features semantic-search,local-embeddings
          fi
        shell: bash

      - name: Prepare Cargo binary (Unix)
        if: ${{ !matrix.bazel && runner.os != 'Windows' }}
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             ${{ env.BINARY_NAME }}-${{ matrix.target }}
          chmod +x ${{ env.BINARY_NAME }}-${{ matrix.target }}
        shell: bash

      - name: Prepare Cargo binary (Windows)
        if: ${{ !matrix.bazel && runner.os == 'Windows' }}
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe `
             ${{ env.BINARY_NAME }}-${{ matrix.target }}.exe
        shell: pwsh

      # ── Common: plugin packaging + upload ─────────────────────────────
      - name: Package per-platform plugin archive (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p staging/markymark-plugin/bin
          cp -r markymark-plugin/.claude-plugin staging/markymark-plugin/
          cp -r markymark-plugin/hooks staging/markymark-plugin/
          cp -r markymark-plugin/skills staging/markymark-plugin/
          cp -r markymark-plugin/scripts staging/markymark-plugin/
          cp markymark-plugin/.lsp.json staging/markymark-plugin/
          cp markymark-plugin/.mcp.json staging/markymark-plugin/
          cp markymark-plugin/README.md staging/markymark-plugin/ 2>/dev/null || true
          cp ${{ env.BINARY_NAME }}-${{ matrix.target }} staging/markymark-plugin/bin/markymark
          chmod +x staging/markymark-plugin/bin/markymark
          chmod +x staging/markymark-plugin/scripts/*.sh
          tar -czf "markymark-plugin-${{ matrix.target }}-${TAG}.tar.gz" \
              -C staging markymark-plugin
        shell: bash

      - name: Package per-platform plugin archive (Windows)
        if: runner.os == 'Windows'
        run: |
          $Tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force -Path staging/markymark-plugin/bin
          Copy-Item -Recurse markymark-plugin/.claude-plugin staging/markymark-plugin/
          Copy-Item -Recurse markymark-plugin/hooks staging/markymark-plugin/
          Copy-Item -Recurse markymark-plugin/skills staging/markymark-plugin/
          Copy-Item -Recurse markymark-plugin/scripts staging/markymark-plugin/
          Copy-Item markymark-plugin/.lsp.json staging/markymark-plugin/
          Copy-Item markymark-plugin/.mcp.json staging/markymark-plugin/
          if (Test-Path markymark-plugin/README.md) {
            Copy-Item markymark-plugin/README.md staging/markymark-plugin/
          }
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" `
                    staging/markymark-plugin/bin/markymark.exe
          Compress-Archive -Path staging/markymark-plugin -DestinationPath `
              "markymark-plugin-${{ matrix.target }}-${Tag}.zip"
        shell: pwsh

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: markymark-plugin-${{ matrix.target }}-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/binary-*/; do
            cp "${dir}"* release-assets/ 2>/dev/null || true
          done
          for dir in artifacts/plugin-*/; do
            cp "${dir}"* release-assets/ 2>/dev/null || true
          done
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
