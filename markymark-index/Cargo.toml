[package]
name = "markymark-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Document indexing and cross-reference resolution for markdown workspaces"
keywords = ["markdown", "index", "cross-reference", "workspace"]
categories = ["development-tools", "text-processing"]

[features]
bench-internals = []

[dependencies]
markymark-core = { version = "=0.1.0-alpha.2", path = "../markymark-core" }
markymark-parser = { version = "=0.1.0-alpha.2", path = "../markymark-parser" }
petgraph = { workspace = true }
bumpalo = { workspace = true }
hashbrown = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
memory-stats = "1.2"
libc = "0.2.182"

[[bin]]
name = "bench_roi_report"
required-features = ["bench-internals"]

[[bench]]
name = "memory"
harness = false
required-features = ["bench-internals"]
