[package]
name = "markymark-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types and traits for the markymark markdown LSP and MCP server"
keywords = ["markdown", "lsp", "parser", "types"]
categories = ["development-tools", "text-processing"]

[features]
default = []
zig-kernels = ["dep:markymark-kernels"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bumpalo = { workspace = true }
hashbrown = { workspace = true }
markymark-kernels = { path = "../markymark-kernels", optional = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
