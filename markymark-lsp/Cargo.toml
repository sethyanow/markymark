[package]
name = "markymark-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "LSP server for markdown with go-to-definition, references, hover, and diagnostics"
keywords = ["markdown", "lsp", "language-server", "editor"]
categories = ["development-tools", "text-editors"]

[dependencies]
markymark-core = { version = "0.4.0", path = "../markymark-core" }
markymark-parser = { version = "0.4.0", path = "../markymark-parser" }
markymark-index = { version = "0.4.0", path = "../markymark-index", features = ["zig-kernels"] }
markymark-kernels = { version = "0.4.0", path = "../markymark-kernels" }
tower-lsp-server = { workspace = true }
lsp-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
